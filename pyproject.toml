[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagshop"
version = "0.1.0"
description = "Interactive DAG-drawing workshop tool for PM and data scientist pairs, producing DAGs for dowhy.gcm causal modeling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ryan O'Sullivan", email = "raz1470@hotmail.co.uk" }]
keywords = [
    "causal-inference",
    "causal-discovery",
    "dag",
    "dowhy",
    "causal-graph",
    "workshop-tool",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Runtime dependencies, added as each module is built (see NOTES.md build
# order). graph.py needs networkx; associate.py needs pandas/sklearn;
# server.py needs fastapi + a plain (no [standard] extra, to keep the
# dependency surface -- and telemetry audit surface, see SCOPE.md -- as
# small as possible) uvicorn to run it.
#
# dowhy was deliberately kept OUT of this list through the original build:
# the exported DAG was loaded into the user's own dowhy.gcm downstream, per
# SCOPE.md. SCOPE.md's "Causal attribution feature" section reverses that:
# dagshop now wraps dowhy.gcm itself (causal_model.py, build order step 4)
# for refutation and attribution, so dowhy is a real dependency from here
# on. dowhy's own metadata caps at <3.14 (see .python-version, pinned to
# 3.12 for local dev because of this).
dependencies = [
    "networkx>=3.2",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "dowhy>=0.14",
]

[project.scripts]
dagshop = "dagshop.cli:main"

[project.urls]
Homepage = "https://github.com/raz1470/dagshop"
Repository = "https://github.com/raz1470/dagshop"
Issues = "https://github.com/raz1470/dagshop/issues"

[dependency-groups]
# `test` is the lean slice CI's `test`/`lint` jobs install: package deps
# + pytest/ruff/httpx (httpx: FastAPI's TestClient needs it). `dev`
# includes `test` plus local-only tooling via include-group, rather than
# repeating pytest/pytest-cov/ruff directly.
#
# `frontend` is deliberately separate from both: it pulls in Playwright
# plus a real Chromium download for the headless-browser smoke test
# (tests/test_frontend_smoke.py, pytest marker "frontend", skipped by
# default -- see [tool.pytest.ini_options] below). Keeping it out of
# `dev` means the day-to-day local dev sync doesn't require a browser
# download; CI's dedicated `frontend` job installs this group
# explicitly.
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]
dev = [
    "pre-commit>=3.0",
    { include-group = "test" },
]
frontend = [
    "playwright>=1.47",
    "pytest-playwright>=0.5",
    { include-group = "test" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/dagshop"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "frontend: needs a live server + a headless browser (Playwright/Chromium). Skipped by default (see addopts); run explicitly with `pytest -m frontend` after `uv sync --group frontend && uv run playwright install --with-deps chromium`.",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--assert=plain",
    "--cov=dagshop",
    "--cov-report=term-missing",
    "-m",
    "not frontend",
]

[tool.coverage.run]
branch = true
source = ["dagshop"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
]
