name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-default-groups --group test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-default-groups --group test --python ${{ matrix.python-version }} pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-default-groups --group test

      - name: Ruff format check
        run: uv run --no-default-groups --group test ruff format --check .

      - name: Ruff lint
        run: uv run --no-default-groups --group test ruff check .

  # Headless-browser smoke test for static/'s Cytoscape/Plotly UI, mirrors
  # how_wrong_is_your_mmm's chart-legibility check (PREFERENCES.md). Kept
  # as its own job/group (see pyproject.toml's `frontend` dependency group)
  # so the test/lint jobs above don't pay for a Chromium download. The
  # test itself is marker "frontend", skipped by pytest's default addopts
  # everywhere except this explicit `-m frontend` invocation.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-default-groups --group frontend

      - name: Install Chromium
        run: uv run --no-default-groups --group frontend playwright install --with-deps chromium

      - name: Run frontend smoke test
        run: uv run --no-default-groups --group frontend pytest -m frontend
